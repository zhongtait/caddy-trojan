name: Build Caddy-Trojan

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Upstream imgk/caddy-trojan commit to build'
        required: false
        type: string
      caddy_version:
        description: 'Exact Caddy version to build (default: latest stable)'
        required: false
        type: string
      source_ref:
        description: 'Exact caddy-trojan repository commit to release'
        required: false
        type: string
  workflow_call:
    inputs:
      upstream_sha:
        description: 'Upstream imgk/caddy-trojan commit to build'
        required: false
        type: string
      caddy_version:
        description: 'Exact Caddy version to build (default: latest stable)'
        required: false
        type: string
      source_ref:
        description: 'Exact caddy-trojan repository commit to release'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: easytrojan-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and validate release parameters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      caddy_version: ${{ steps.resolve.outputs.caddy_version }}
      project_version: ${{ steps.resolve.outputs.project_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve canonical commits
        id: resolve
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref || github.sha }}
          REQUESTED_UPSTREAM: ${{ inputs.upstream_sha || '' }}
          REQUESTED_CADDY_VERSION: ${{ inputs.caddy_version || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! SOURCE_SHA=$(git rev-parse --verify --end-of-options "${REQUESTED_SOURCE}^{commit}" 2>/dev/null); then
            echo "::error::Cannot resolve source_ref '${REQUESTED_SOURCE}' to a valid commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::Refusing to release a commit that is not on main: ${SOURCE_SHA}" >&2
            exit 1
          }
          UPSTREAM_SHA="${REQUESTED_UPSTREAM:-}"
          if [ -z "$UPSTREAM_SHA" ]; then
            RELEASE_STATUS=$(curl -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: Caddy-Trojan-CI" \
              --output "${RUNNER_TEMP}/latest-release.json" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")
            case "$RELEASE_STATUS" in
              200)
                UPSTREAM_SHA=$(jq -r 'first((.body // "") | split("\n")[]
                    | try capture("^- Upstream plugin SHA: \u0060(?<sha>[0-9a-fA-F]{40})\u0060").sha catch empty) // ""' \
                    "${RUNNER_TEMP}/latest-release.json")
                ;;
              404)
                UPSTREAM_SHA=$(git show "${SOURCE_SHA}:sha" | tr -d '[:space:]')
                ;;
              *)
                echo "Unable to resolve upstream SHA from latest Release (HTTP ${RELEASE_STATUS})" >&2
                exit 1
                ;;
            esac
          fi
          if ! printf '%s' "$UPSTREAM_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Invalid upstream SHA: ${UPSTREAM_SHA:-<empty>}" >&2
            exit 1
          fi
          CADDY_VERSION="${REQUESTED_CADDY_VERSION:-}"
          if [ -n "$CADDY_VERSION" ] && ! printf '%s' "$CADDY_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid Caddy version: ${CADDY_VERSION}" >&2
            exit 1
          fi
          PROJECT_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$PROJECT_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Invalid project version: ${PROJECT_VERSION:-<empty>}" >&2
            exit 1
          fi
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "caddy_version=${CADDY_VERSION}"
            echo "project_version=${PROJECT_VERSION}"
          } >> "$GITHUB_OUTPUT"

  build-caddy-trojan:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
          - os: linux
            arch: arm64
            goarch: arm64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install xcaddy v0.4.7
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7

      - name: Build Caddy-Trojan
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOTOOLCHAIN: 'auto'
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          CADDY_VERSION: ${{ needs.resolve.outputs.caddy_version }}
        run: |
          set -euo pipefail
          mkdir -p output
          cd output
          UPSTREAM_SHA="${UPSTREAM_SHA:-$(tr -d '[:space:]' < ../sha)}"
          if ! printf '%s' "$UPSTREAM_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid upstream SHA: ${UPSTREAM_SHA:-<empty>}" >&2
            exit 1
          fi
          echo "Building Caddy ${CADDY_VERSION:-latest} with imgk/caddy-trojan at ${UPSTREAM_SHA} and outbound IP-family support"
          git clone --filter=blob:none https://github.com/imgk/caddy-trojan.git caddy-trojan
          git -C caddy-trojan checkout --detach "${UPSTREAM_SHA}"
          git -C caddy-trojan apply ../../patches/caddy-trojan-outbound-ip.patch
          git -C caddy-trojan diff --check
          if [ -n "${CADDY_VERSION:-}" ]; then
            xcaddy build "$CADDY_VERSION" --with "github.com/imgk/caddy-trojan=./caddy-trojan"
          else
            xcaddy build --with "github.com/imgk/caddy-trojan=./caddy-trojan"
          fi
          FILENAME="caddy_trojan_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar -czf "../${FILENAME}" caddy

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: caddy_trojan_${{ matrix.os }}_${{ matrix.arch }}
          path: caddy_trojan_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Release validation gate
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_sha }}

  integration:
    name: Real Linux integration gate
    needs: [resolve, build-caddy-trojan]
    uses: ./.github/workflows/integration.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_sha }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      caddy_artifact: caddy_trojan_linux_amd64

  version:
    name: Inspect Caddy version in isolation
    needs: [resolve, build-caddy-trojan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Download amd64 Caddy artifact
        uses: actions/download-artifact@v5
        with:
          name: caddy_trojan_linux_amd64
          path: artifact

      - name: Validate archive and read version
        id: version
        env:
          EXPECTED_CADDY_VERSION: ${{ needs.resolve.outputs.caddy_version }}
        run: |
          set -euo pipefail
          archive=artifact/caddy_trojan_linux_amd64.tar.gz
          tar -tzf "$archive" | awk '
            BEGIN { count=0 }
            { count++; if ($0 != "caddy") bad=1 }
            END { exit !(count == 1 && !bad) }
          '
          tar -tvzf "$archive" | awk '
            BEGIN { count=0 }
            { count++; if (substr($0, 1, 1) != "-") bad=1 }
            END { exit !(count == 1 && !bad) }
          '
          tar -xzf "$archive" -C "$RUNNER_TEMP" caddy
          VERSION=$("${RUNNER_TEMP}/caddy" version | awk '{print $1}')
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Unexpected Caddy version: ${VERSION:-<empty>}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_CADDY_VERSION:-}" ] && [ "$VERSION" != "$EXPECTED_CADDY_VERSION" ]; then
            echo "Built Caddy ${VERSION}, expected ${EXPECTED_CADDY_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  plugin_version:
    name: Resolve caddy-trojan plugin version
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plugin.outputs.version }}
    steps:
      - name: Describe the exact upstream plugin commit
        id: plugin
        env:
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/imgk/caddy-trojan.git caddy-trojan
          git -C caddy-trojan checkout --detach "${UPSTREAM_SHA}"
          PLUGIN_VERSION=$(git -C caddy-trojan describe --tags --long --always "${UPSTREAM_SHA}")
          echo "version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

  metadata:
    name: Prepare release assets
    needs: [resolve, build-caddy-trojan, version, plugin_version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project_version: ${{ steps.meta.outputs.project_version }}
      caddy_version: ${{ steps.meta.outputs.caddy_version }}
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all Caddy artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate artifacts and prepare release metadata
        id: meta
        env:
          REQUESTED_SOURCE: ${{ needs.resolve.outputs.source_sha }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          CADDY_VERSION: ${{ needs.version.outputs.version }}
          PROJECT_VERSION: ${{ needs.resolve.outputs.project_version }}
          PLUGIN_VERSION: ${{ needs.plugin_version.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_SOURCE" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "source_ref must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "${SOURCE_SHA,,}" != "${REQUESTED_SOURCE,,}" ]; then
            echo "Checked out ${SOURCE_SHA}, expected ${REQUESTED_SOURCE}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Refusing to release a commit that is not on main: ${SOURCE_SHA}" >&2
            exit 1
          }

          UPSTREAM_SHA="${UPSTREAM_SHA:-$(tr -d '[:space:]' < sha)}"
          if ! printf '%s' "$UPSTREAM_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid upstream SHA: ${UPSTREAM_SHA:-<empty>}" >&2
            exit 1
          fi

          for archive in artifacts/caddy_trojan_*.tar.gz; do
            [ -f "$archive" ] || { echo "Missing Caddy archive" >&2; exit 1; }
            tar -tzf "$archive" | awk '
              BEGIN { count=0 }
              { count++; if ($0 != "caddy") bad=1 }
              END { exit !(count == 1 && !bad) }
            '
            tar -tvzf "$archive" | awk '
              BEGIN { count=0 }
              { count++; if (substr($0, 1, 1) != "-") bad=1 }
              END { exit !(count == 1 && !bad) }
            '
          done

          if ! printf '%s' "$CADDY_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid isolated Caddy version output: ${CADDY_VERSION:-<empty>}" >&2
            exit 1
          fi
          if ! printf '%s' "$PROJECT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid project version: ${PROJECT_VERSION:-<empty>}" >&2
            exit 1
          fi

          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Release signing/publishing is only allowed from refs/heads/main" >&2
            exit 1
          }
          TAG="v${PROJECT_VERSION}"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0) echo "Release tag already exists; refusing to reuse it: ${TAG}" >&2; exit 1 ;;
            2) ;;
            *) echo "Could not verify release tag availability: ${TAG}" >&2; exit 1 ;;
          esac

          tar -czf artifacts/easytrojan_bundle.tar.gz easytrojan.sh hub_server.py lib
          (
            cd artifacts
            sha256sum -- *.tar.gz > SHA256SUMS
          )
          {
            echo "project_version=${PROJECT_VERSION}"
            echo "caddy_version=${CADDY_VERSION}"
            echo "plugin_version=${PLUGIN_VERSION}"
            echo "tag=${TAG}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"
          cat artifacts/SHA256SUMS

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign release manifest
    needs: [validate, integration, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download unsigned release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Install cosign v3.1.3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign and verify release manifest
        env:
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          RELEASE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            artifacts/SHA256SUMS >/dev/null
          cosign verify-blob \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$RELEASE_IDENTITY" \
            --certificate-oidc-issuer "$RELEASE_OIDC_ISSUER" \
            artifacts/SHA256SUMS

      - name: Upload signed release assets
        uses: actions/upload-artifact@v5
        with:
          name: signed-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [metadata, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v5
        with:
          name: signed-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          body: |
            # EasyTrojan v${{ needs.metadata.outputs.project_version }}

            - Project version: `v${{ needs.metadata.outputs.project_version }}`
            - Caddy version: `${{ needs.metadata.outputs.caddy_version }}`
            - caddy-trojan plugin version: `${{ needs.metadata.outputs.plugin_version }}`
            - Upstream plugin SHA: `${{ needs.metadata.outputs.upstream_sha }}`
            - EasyTrojan source SHA: `${{ needs.metadata.outputs.source_sha }}`
            - Built with [Caddy](https://github.com/caddyserver/caddy) and [imgk/caddy-trojan](https://github.com/imgk/caddy-trojan)
            - Verify every download with `SHA256SUMS` and `SHA256SUMS.sigstore.json`
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.source_sha }}
          name: EasyTrojan v${{ needs.metadata.outputs.project_version }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: false
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sigstore.json
          fail_on_unmatched_files: true

  advance-version:
    name: Prepare the next project version
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Increment VERSION after successful publication
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.project_version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "VERSION changed to ${CURRENT_VERSION} after release resolution; leaving it untouched"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT_VERSION="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$NEXT_VERSION" > VERSION
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VERSION
          git commit -m "chore(release): prepare v${NEXT_VERSION}"
          git push origin HEAD:refs/heads/main
